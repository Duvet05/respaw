name: Verificar ResPaw

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Pruebas y capturas
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Verificar Python, firmware y JavaScript
        run: |
          python -m pip install -r requirements-link.txt
          make check
      - name: Preparar navegador de prueba
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Probar interfaz con datos ficticios
        env:
          PYTHONPATH: companion
          RESPAW_SCREENSHOT_DIR: ${{ runner.temp }}/respaw-screenshots
        run: |
          python tests/browser_smoke.py --browser chromium
          python tests/browser_voice_smoke.py --browser chromium
          python tests/browser_contact_smoke.py --browser chromium
      - name: Adjuntar capturas para revisión
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: respaw-capturas
          path: ${{ runner.temp }}/respaw-screenshots/*.png
          if-no-files-found: warn
          retention-days: 30
